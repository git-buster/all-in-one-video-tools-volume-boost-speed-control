<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All-in-One Video Tools | Volume Boost &amp; Speed Control</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><rect x="1" y="1" width="30" height="30" rx="10" fill="#98EDB1"/><path d="m12 9 12 7-12 7V9Z" fill="#173729"/></svg>
        </div>
        <strong id="brand-name">All-in-One Video Tools | Volume Boost &amp; Speed Control</strong>
      </div>
      <select id="language" aria-label="Language">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
      <button id="exit" class="exit-button" type="button" data-i18n="exit" hidden>Exit</button>
    </header>

    <section id="gate" class="gate" hidden>
      <div class="site-box"><span id="gate-site"></span></div>
      <button id="allow" class="primary-button" type="button"><span data-i18n="allow">Allow access to this page</span></button>
    </section>

    <section id="controls" class="controls" hidden>
      <div class="page-summary">
        <div class="page-details"><p class="eyebrow" data-i18n="currentPage">CURRENT PAGE</p><strong id="control-site"></strong><span id="video-count" class="video-count"></span></div>
        <button id="reset-all" class="reset-all" type="button"><span aria-hidden="true">↺</span><span data-i18n="resetAll">Reset all to default</span></button>
      </div>

      <section class="control-card" aria-labelledby="volume-title">
        <div class="card-heading"><div><span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/></svg></span><h2 id="volume-title" data-i18n="volumeTitle">Extra volume</h2></div><button id="reset-volume" class="text-button" type="button" data-i18n="restore100">Restore 100%</button></div>
        <div class="value-line"><strong id="volume-value">100%</strong><span data-i18n="volumeCaption">Original sound = 100%</span></div>
        <input id="volume" type="range" min="0" max="1000" step="10" value="100" aria-labelledby="volume-title">
        <div class="range-labels volume-scale"><span>0%</span><span>100%</span><span>1000%</span></div>
        <div id="volume-presets" class="presets volume-presets" role="group" aria-label="Extra volume presets">
          <button type="button" data-boost="200">200%</button>
          <button type="button" data-boost="500">500%</button>
          <button type="button" data-boost="600">600%</button>
          <button type="button" data-boost="800">800%</button>
          <button type="button" data-boost="1000">1000%</button>
        </div>
      </section>

      <section class="control-card" aria-labelledby="speed-title">
        <div class="card-heading"><div><span class="card-icon speed-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m4 5 8 7-8 7V5Zm9 0 8 7-8 7V5Z"/></svg></span><h2 id="speed-title" data-i18n="speedTitle">Playback speed</h2></div><button id="reset-speed" class="text-button" type="button" data-i18n="restore1">Restore 1×</button></div>
        <div class="value-line speed-value-line"><strong id="speed-value" class="speed-value">1×</strong><div class="custom-speed"><label for="speed-input" data-i18n="customSpeed">Custom speed</label><div class="number-wrap"><input id="speed-input" type="number" min="0.25" max="16" step="0.01" value="1" inputmode="decimal"><span>×</span></div></div></div>
        <input id="speed" type="range" min="0.25" max="16" step="0.01" value="1" aria-labelledby="speed-title">
        <div class="range-labels"><span>0.25×</span><span>16×</span></div>
        <div id="presets" class="presets speed-presets" role="group" aria-label="Playback speed presets">
          <button type="button" data-rate="1.25">1.25×</button>
          <button type="button" data-rate="1.5">1.5×</button>
          <button type="button" data-rate="2">2×</button>
          <button type="button" data-rate="2.5">2.5×</button>
          <button type="button" data-rate="3">3×</button>
        </div>
      </section>

    </section>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  </main>
</body>
</html>
